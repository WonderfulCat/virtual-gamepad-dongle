name: Build Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install West and Dependencies
        run: |
          pip install west
          sudo apt update && sudo apt install -y cmake ninja-build gperf ccache dfu-util device-tree-compiler wget python3-setuptools xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Initialize Zephyr workspace
        run: |
          west init -l dongle-firmware
          west update
          west zephyr-export

      - name: Download Zephyr SDK (ARM Toolchain)
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64_minimal.tar.xz
          tar -xf zephyr-sdk-0.16.5_linux-x86_64_minimal.tar.xz
          ./zephyr-sdk-0.16.5/setup.sh -t arm-zephyr-eabi -c

      - name: Build Firmware for Pico
        run: |
          cd dongle-firmware
          west build -b rpi_pico app -- -DZEPHYR_SDK_INSTALL_DIR=$GITHUB_WORKSPACE/zephyr-sdk-0.16.5

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-gamepad-firmware
          path: dongle-firmware/build/zephyr/zephyr.uf2

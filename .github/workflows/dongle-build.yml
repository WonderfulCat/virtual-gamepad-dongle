name: dongle-build

on:
  push:
    paths:
      - 'dongle-firmware/**'
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -x -e -o pipefail {0}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up some disk space
        run: |
          df -h
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /usr/share/dotnet || true
          df -h
      - uses: actions/checkout@v6
      - name: Build
        run: |
          cd dongle-firmware
          docker run -v $PWD:/workspace/project -w /workspace/project ghcr.io/zephyrproject-rtos/ci:v0.29.2 ./build.sh vatican-cameos
      - uses: actions/upload-artifact@v7
        with:
          name: dongle-artifact
          path: dongle-firmware/artifacts/*
